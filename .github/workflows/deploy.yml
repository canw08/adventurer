name: Deploy to BT via IP
on:
  push:
    tags:
      - 'v*'           # 只有推送以 v 开头的 tag（如 v1.2.3）才触发部署
  workflow_dispatch: {} # （可选）也允许在 Actions 页面手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci
      - run: npm run build

      - name: Upload dist via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/*"
          target: "/www/wwwroot/app"
          strip_components: 1

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo /www/server/nginx/sbin/nginx -t -c /www/server/nginx/conf/nginx.conf && \
            sudo /www/server/nginx/sbin/nginx -s reload -c /www/server/nginx/conf/nginx.conf
